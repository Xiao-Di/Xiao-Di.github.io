[[items]]
title = "Prototype Verification System for Satellite Internet Cloud–Network Convergence Integrating [Redacted]"
subtitle = "CYL Project of the National Development and Reform Commission"
date = "2023.12—2025.12"
content = "Research on satellite Internet integrating communications, navigation, sensing, and intelligence; establishment of an integrated satellite Internet architecture; and breakthroughs in key technologies including highly dynamic spatiotemporal resource representation, multidimensional resource trend prediction, multidimensional time-varying resource allocation, and multidimensional intelligent resource planning. The project aims to enhance satellite Internet service capabilities, support integrated satellite–ground network construction, and advance functional convergence."
