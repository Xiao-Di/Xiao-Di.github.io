[[items]]
title = "Research on Key Cloud–Network Convergence Technologies for Satellite Internet Constellations"
subtitle = "Beijing Natural Science Foundation–Beijing University of Posts and Telecommunications"
date = "2023.11—2026.12"
content = "Research on heterogeneous multi-layer cloud–network convergence architectures for satellite constellations, virtualization and intelligent awareness of satellite networking and computing resources, and constellation cloud–edge intelligent collaboration with differentiated QoS guarantees."
tags = ["20W"]

[[items]]
title = "Satellite–Ground Collaborative Access and Transmission Technologies under Highly Dynamic Conditions"
subtitle = "National Key R&D Program, Ministry of Science and Technology"
date = "2023.07—2025.10"
content = "Systematic research spanning scenarios, architectures, key technologies, and verification to develop a satellite–ground collaborative access and transmission solution. The project targets a flexible and elastic collaborative architecture, efficient cross-domain resource scheduling, agile access and handover, and highly efficient transmission."
tags = ["3534W"]

[[items]]
